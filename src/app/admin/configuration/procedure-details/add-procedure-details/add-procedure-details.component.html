<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Catalogo Procedimientos'" [items]="[]" [active_item]="'Nuevo Procedimiento'"></app-breadcrumb>
    </div>
    <div class="row clearfix">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="card">
          <div class="header">
            <h2>Nuevo</h2>

          </div>
          <div class="body">
            <form class="mx-4" [formGroup]="procedureDetailsForm">
              <div class="row">
                <div class="col-xl-3 col-lg-5 col-md-12 col-sm-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Folio</mat-label>
                    <input matInput formControlName="folio" required>
                    <!-- <mat-error *ngIf="doctorForm.get('nombre')?.hasError('required')">
                      Nombre es requerido
                    </mat-error> -->
                    <mat-error *ngIf="campoEsValido('folio')">{{'Debe ingresar el folio'}}</mat-error>
                  </mat-form-field>
                </div>

                <div class="col-xl-5 col-lg-5 col-md-12 col-sm-12">

                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Nombre Procedimiento</mat-label>
                    <input matInput formControlName="nombre_procedimiento" required>
                    <!-- <mat-error *ngIf="doctorForm.get('nombre')?.hasError('required')">
                      Nombre es requerido
                    </mat-error> -->
                    <mat-error *ngIf="campoEsValido('nombre_procedimiento')">{{'Debe ingresar el nombre'}}</mat-error>
                  </mat-form-field>
                </div>
                <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12">
                   <mat-form-field class="example-full-width" appearance="outline">
                        <mat-label>Especialidad</mat-label>
                        <mat-select formControlName="especialidad">
                            <mat-option *ngFor="let specialty of specialties" [value]="specialty.id_especialidad">
                            {{specialty.nombre_especialidad}}
                            </mat-option>
                        </mat-select>
                        <mat-error *ngIf="campoEsValido('especialidad')">{{'Debe seleccionar la especialidad'}}</mat-error>
                    </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                  <button class="btn-space" mat-raised-button color="primary" (click)="addProcedure()">Guardar</button>
                  <button type="button" mat-raised-button color="primary" (click)="return()">Cancel</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
