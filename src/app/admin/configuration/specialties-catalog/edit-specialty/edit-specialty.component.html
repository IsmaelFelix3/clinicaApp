<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Catalogo Especialidades'" [items]="[]" [active_item]="'Editar Especialidad'"></app-breadcrumb>
    </div>
    <div class="row clearfix">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="card">
          <div class="header">
            <h2>Editar Especialidad</h2>
          </div>
          <div class="body">
            <form class="mx-4" [formGroup]="specialtyForm">
              <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Nombre Especialidad</mat-label>
                    <input class="uppercase" matInput formControlName="nombre_especialidad" required>
                    <!-- <mat-error *ngIf="doctorForm.get('nombre')?.hasError('required')">
                      Nombre es requerido
                    </mat-error> -->
                    <mat-error *ngIf="campoEsValido('nombre_especialidad')">{{'Debe ingresar el nombre de la especialidad'}}</mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                  <button class="btn-space" mat-raised-button color="primary" (click)="editProcedure()">Editar</button>
                  <button type="button" mat-raised-button color="warn" (click)="return()">Cancel</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
