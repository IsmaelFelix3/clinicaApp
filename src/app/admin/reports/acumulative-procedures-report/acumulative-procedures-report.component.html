<section class="content">
  <div class="content-block">
    <div class="block-header">
    </div>
    <div class="row">
      <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
        <div class="card">
          <div style="background-color: #144464;" class="header">
             <div class="export-button m-l-10 image-upload" >
                        <label for="uploadBtn">
                           <img src="assets/images/icons/xlsx.png" matTooltip="Exportar"/>
                         </label>

                      </div>
            <h2 style="color:white;">Reporte Acumulado de Procedimientos</h2>
          </div>
          <div>
            <table>
              <tbody>
                <tr>
                  <!-- <th *ngFor="let col of columns;">{{col}}</th> -->
                  <th *ngFor="let col of monthsColumns;">{{col}}</th>

                </tr>
                <!-- <tr *ngFor="let row of data">
                  <td *ngFor="let item of row">{{item[0].Catalogo_Procedimiento.nombre_procedimiento}}</td> -->
                  <!-- <td>{{row.data.}}</td>
                  <td>{{row.cantidad}}</td> -->
                <!-- </tr> -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
        <div class="card">
          <div style="background-color: #144464;" class="header">
            <h2 style="color:white;">Filtros</h2>
          </div>
           <div class="mt-3">
              <form [formGroup]="form">

                  <mat-form-field class="col-3 me-2" appearance="outline">
                    <mat-label>Fecha Inicio</mat-label>
                    <input matInput  formControlName="start" [matDatepicker]="picker">
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker startView="year" #picker></mat-datepicker>
                    <!-- <mat-error *ngIf="campoEsValido('start')">{{'Debe seleccionar una fecha de inicio'}}</mat-error> -->
                  </mat-form-field>

                   <mat-form-field class="col-3" appearance="outline">
                    <mat-label>Fecha Fin</mat-label>
                    <input matInput  formControlName="end" [matDatepicker]="picker2">
                    <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                    <mat-datepicker startView="year" #picker2></mat-datepicker>
                    <!-- <mat-error *ngIf="campoEsValido('end')">{{'Debe seleccionar una fecha fin'}}</mat-error> -->
                  </mat-form-field>
                  <mat-form-field class="col-5 ms-3" appearance="outline">
                    <mat-label>Procedimiento</mat-label>
                    <mat-select formControlName="procedimiento" required>
                      <mat-option *ngFor="let procedure of proceduresCatalog" [value]="procedure.id_procedimiento">
                        {{procedure.nombre_procedimiento}}
                      </mat-option>
                    </mat-select>
                  </mat-form-field>
                  <button class="ms-4" mat-raised-button color="primary" (click)="search()" >
                      <mat-icon>search</mat-icon>
                      Buscar
                  </button>
              </form>
            </div>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12 col-xs-12">
          <div class="card">
            <div style="background-color: #144464;" class="header">
                <h2 style="color:white;">Resultado</h2>
              </div>
              <table class="table-striped">
                <th *ngFor="let col of columnsSearch">{{col}}</th>
                <tr *ngFor="let row of proceduresByMonth">
                  <!-- <td>{{row.procedimiento}}</td> -->
                  <td>{{row.month}}</td>
                  <td>{{row.total}}</td>
                </tr>
              </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
